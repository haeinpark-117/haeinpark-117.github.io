<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courses · Hae In Park</title>
<meta name="description" content="박해인 교수 강의 페이지 모음 · 경희대학교 응용영어통번역학과">
<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{--paper:#F1EEE8;--ink:#141414;--red:#E3372B;--soft:#5E5A55;
  --cond:"Archivo","Noto Sans KR",sans-serif;--serif:"Instrument Serif",Georgia,serif;--kr:"Noto Sans KR","Archivo",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--kr);line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:50;pointer-events:none;opacity:.22;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.4  0 0 0 0 0.38  0 0 0 0 0.35  0 0 0 .55 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>")}
.wrap{max-width:920px;margin:0 auto;padding:0 max(18px,env(safe-area-inset-left,0px))}
.cond{font-family:var(--cond);font-stretch:68%;font-weight:600;letter-spacing:-.035em;text-transform:uppercase}
.top{display:flex;justify-content:space-between;padding:26px 0 0;font-family:var(--cond);font-stretch:90%;font-weight:700;font-size:15px;line-height:1.15}
.top small{display:block;font-family:var(--kr);font-weight:500;font-size:12px;color:var(--soft)}
.top a{color:inherit;text-decoration:none}
.top .r{text-align:right}
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-top:70px;border-bottom:2px solid var(--ink);padding-bottom:10px}
h1{margin:0;font-size:clamp(84px,20vw,210px);line-height:.8}
.hero svg{width:clamp(70px,14vw,130px);height:auto;fill:var(--red);flex:none;margin-bottom:8px}
.lead{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;margin:10px 0 0;font-size:15px;font-weight:700}
.lead .it{font-family:var(--serif);font-style:italic;font-weight:400;font-size:20px}
.list{margin:46px 0 80px;border-top:2px solid var(--ink)}
a.item{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:6px 22px;padding:20px 0;border-bottom:1px solid var(--ink);color:inherit;text-decoration:none;transition:background .15s,color .15s,padding .15s}
a.item:hover,a.item:focus-visible{background:var(--red);color:var(--paper);padding-left:14px;padding-right:14px;outline:none}
.code{font-family:var(--serif);font-style:italic;font-size:22px;line-height:1.1}
.t{font-size:clamp(28px,4.6vw,44px);line-height:.9}
.k{display:block;font-weight:700;font-size:14px;margin-top:6px}
.tag{display:inline-block;border:1.5px solid currentColor;padding:1px 8px;font-size:12px;font-weight:700;margin-left:6px;vertical-align:1px}
.arrow{font-family:var(--serif);font-size:44px;line-height:1}
footer{border-top:2px solid var(--ink);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:12px 0 46px;font-family:var(--cond);font-stretch:85%;font-weight:600;font-size:13px;text-transform:uppercase}
footer .it{font-family:var(--serif);font-style:italic;font-weight:400;text-transform:none;font-size:17px}
@media (max-width:640px){a.item{grid-template-columns:1fr auto}.code{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  </div>
  <header>
    <div class="hero">
      <h1 class="cond">Courses</h1>
      <svg viewBox="0 0 100 100" aria-hidden="true"><path d="M50 2 L58 38 L95 22 L66 50 L98 74 L58 64 L52 98 L42 63 L6 80 L34 50 L4 24 L42 37 Z"/></svg>
    </div>
    <div class="lead"><span>강의 소개 · 수강 안내 · 설문</span><span class="it">Dept. of Applied English Linguistics &amp; Translation Studies</span></div>

  <nav class="list" aria-label="강의 페이지">

      <span class="code">AELTS4017</span>

      <span class="arrow" aria-hidden="true">→</span>
    </a>
  </nav>
  <footer><span>AELTS · Kyung Hee University</span><span class="it">Hae In Park</span></footer>
</div>
</body>
</html>
