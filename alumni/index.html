<style>
:root{--pinc:#FFFFFF;--blue:#3BB3E0;--sky:#3BB3E0;--turq:#7FE8B5;--skyd:#1B86AE;--ink:#111;--paper:#fff;--river:#111;--muted:#6b6b6b;--page:#EDEDED;--hair:#d8d8d8}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--page);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;overflow:hidden}
.app{display:grid;grid-template-columns:1fr 340px;height:100vh}
.mapwrap{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:18px}
svg#map{width:100%;height:100%;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.12))}
.mont{font-family:'Montserrat',sans-serif}

.pin{cursor:pointer}
.pin:focus{outline:none}
.pin .dm{transition:fill .15s}
.pin .dm{stroke:#111;stroke-width:1.6}
.pin:hover .dm,.pin.active .dm{fill:#111;stroke:#fff}
.pin:hover .dn,.pin.active .dn{fill:#fff}
.pin.active .tag rect,.pin:hover .tag rect{fill:#fff;stroke:#111;stroke-width:2}
.pin.active .tagtxt,.pin:hover .tagtxt{fill:#111}
.tagtxt{font-family:'Noto Sans KR',sans-serif;font-weight:700;font-size:12.5px;fill:#fff}
.edge{cursor:pointer}
svg [tabindex]:focus,svg [tabindex]:focus-visible{outline:none}
.edge .b{transition:fill .15s}
.edge:hover .b,.edge.active .b{fill:#111}
.campus .b{fill:none!important}.campus:hover .b,.campus.active .b{fill:none}
.campus image{transition:transform .15s;transform-box:fill-box;transform-origin:50% 100%}.campus:hover image,.campus.active image{transform:scale(1.06)}
.edge:hover .tt,.edge.active .tt{fill:#fff}
/* only one highlighted at a time: while hovering another marker, the selected one returns to normal */
#map:has(.edge:hover,.pin:hover) .edge.active:not(:hover) .b{fill:#fff}
#map:has(.edge:hover,.pin:hover) .edge.active:not(:hover) .tt{fill:#111}
#map:has(.edge:hover,.pin:hover) .pin.active:not(:hover) .dm{fill:var(--pinc);stroke:#111}
#map:has(.edge:hover,.pin:hover) .pin.active:not(:hover) .dn{fill:#111}
#map:has(.edge:hover,.pin:hover) .pin.active:not(:hover) .tag rect{fill:#111;stroke:none}
#map:has(.edge:hover,.pin:hover) .pin.active:not(:hover) .tagtxt{fill:#fff}
#map:has(.edge:hover,.pin:hover) .campus.active:not(:hover) image{transform:none}

.panel{background:var(--paper);border-left:2px solid var(--ink);display:flex;flex-direction:column;min-height:0}
.phead{padding:24px 24px 16px;border-bottom:1.5px solid var(--ink)}
.kicker{font-family:'Montserrat',sans-serif;font-weight:600;letter-spacing:.16em;font-size:11px;color:var(--muted);text-transform:uppercase}
.phead h2{font-weight:900;font-size:26px;margin:6px 0 4px;letter-spacing:-.02em;line-height:1.25}
.phead p{margin:0;color:var(--muted);font-size:13.5px}
.stats{display:flex;margin-top:16px;border:1.5px solid var(--ink)}
.stat{flex:1;padding:8px 12px;border-right:1.5px solid var(--ink)}
.stat:last-child{border-right:none}
.stat b{font-family:'Montserrat',sans-serif;font-weight:800;font-size:26px;display:block;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
.pbody{padding:14px 20px 28px;overflow-y:auto;flex:1}
.grp{font-family:'Montserrat',sans-serif;font-weight:600;letter-spacing:.14em;font-size:11px;color:var(--muted);margin:16px 0 4px;text-transform:uppercase}
.grp:first-child{margin-top:4px}
.lst button{width:100%;display:flex;align-items:center;gap:10px;background:none;border:none;border-bottom:1px solid var(--hair);padding:10px 2px;cursor:pointer;font:inherit;color:var(--ink);text-align:left}
.lst button:hover{background:#F2F6FF}
.lst .num{width:22px;height:22px;flex:none;display:grid;place-items:center;font-family:'Montserrat';font-weight:800;font-size:11px;color:#fff;background:var(--ink);transform:rotate(45deg) scale(.8)}
.lst .num span{transform:rotate(-45deg)}
.lst .num.sq{transform:none;border-radius:3px}
.lst .pi{flex:none;width:22px}
.lst .nm{flex:1;font-weight:700;font-size:14.5px}
.lst .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.lst .ct{font-family:'Montserrat',sans-serif;font-weight:800;font-size:16px}
.hint{font-size:12.5px;color:var(--muted);margin:14px 2px 0;line-height:1.65}
.back{font-family:'Montserrat',sans-serif;font-weight:600;letter-spacing:.12em;font-size:11px;background:none;border:none;color:var(--ink);cursor:pointer;padding:0;text-transform:uppercase;text-decoration:underline;text-underline-offset:3px}
.loc{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.loc::before{content:"";width:8px;height:8px;border-radius:50%;background:#111}
.card{border:1.5px solid var(--ink);padding:14px;margin-bottom:12px;background:#fff}
.ctop{display:flex;gap:12px;align-items:center}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--ink);border:2px solid var(--ink);color:#fff;font-family:'Montserrat',sans-serif;font-weight:800;font-size:18px;line-height:.95;text-align:center;align-content:center}
.av small{display:block;font-size:9px;font-weight:500;margin-top:1px;line-height:1;font-family:'Noto Sans KR',sans-serif}
.card.private .av{background:#fff;color:var(--ink)}
.cname{font-weight:900;font-size:17.5px;line-height:1.25}
.card.private .cname{font-weight:400;color:var(--muted)}
.crole{font-size:13.5px;color:var(--muted);margin-top:2px}
.cnow{margin-top:11px;font-size:13.5px;line-height:1.7;border-top:1px dashed #bbb;padding-top:9px;white-space:pre-line}
.cnow::before{content:"NOW";display:block;font-family:'Montserrat',sans-serif;font-weight:600;letter-spacing:.16em;font-size:10.5px;color:var(--skyd);margin-bottom:2px}

*{-webkit-tap-highlight-color:transparent}
.tbar{display:none}
@media (min-width:861px){
  body{background:#fff}
  .mapwrap{flex-direction:column;align-items:stretch;padding:0}
  .tbar{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 24px;padding:20px 28px 14px;border-bottom:2px solid #111}
  .tt1{font-family:'Archivo Black','Arial Black',sans-serif;font-size:42px;line-height:1;color:#111;text-shadow:0 -3px #EF4E36,0 -6px #F6C76A,0 3px #3BB3E0,0 6px #7FE8B5;padding:6px 0}
  .tt2{font:600 12px Montserrat,'Noto Sans KR',sans-serif;letter-spacing:.22em;color:#111;padding-bottom:6px;min-width:0}
  svg#map{flex:1;min-height:0;filter:none}
  svg#map .pframe{display:none}
}
.sheet-x,.scrim{display:none}
@media (max-width:860px){
  body{overflow:auto;background:#fff}
  .app{display:block;height:auto}
  .mapwrap{display:block;height:auto;padding:8px 6px}
  svg#map{height:auto;filter:none}
  .hint-zoom{display:block;text-align:center;font-size:12px;color:var(--muted);margin:2px 0 10px}
  .panel{border-left:none;border-top:2px solid var(--ink);min-height:40vh}
  .pbody{overflow:visible;padding:12px 16px calc(24px + env(safe-area-inset-bottom))}
  .phead{padding:18px 16px 12px}
  .phead h2{font-size:23px}
  .lst button{padding:12px 2px}
  /* detail view becomes a bottom sheet */
  body.sheet-open{overflow:hidden}
  body.sheet-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20}
  body.sheet-open .panel{position:fixed;left:0;right:0;bottom:0;max-height:78vh;z-index:21;border-top:none;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.25);min-height:0;animation:up .22s ease-out}
  body.sheet-open .pbody{overflow-y:auto;-webkit-overflow-scrolling:touch}
  body.sheet-open .phead{position:relative;padding-top:26px}
  body.sheet-open .phead::before{content:"";position:absolute;top:9px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:#ccc}
  body.sheet-open .back{display:none}
  body.sheet-open .sheet-x{display:grid;place-items:center;position:absolute;right:12px;top:14px;width:36px;height:36px;border:none;border-radius:50%;background:#f0f0f0;font-size:20px;line-height:1;color:#111;cursor:pointer}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
}
@media (min-width:861px){.hint-zoom{display:none}}
@media (hover:none){
  .pin:hover .dm{fill:var(--pinc);stroke:#111}.pin:hover .dn{fill:#111}
  .pin:hover .tag rect{fill:#111;stroke:none}.pin:hover .tagtxt{fill:#fff}
  .edge:hover .b{fill:#fff}.edge:hover .tt{fill:#111}
  .pin.active .dm{fill:#111;stroke:#fff}.pin.active .dn{fill:#fff}
  .pin.active .tag rect{fill:#fff;stroke:#111;stroke-width:2}.pin.active .tagtxt{fill:#111}
  .edge.active .b{fill:#111}.edge.active .tt{fill:#fff}
}

/* ---------- intro ---------- */
#intro{position:fixed;inset:0;z-index:100;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;transition:opacity .7s ease,transform .7s ease}
#intro.out{opacity:0;transform:translateY(-24px);pointer-events:none}
#intro .i1{font-family:'Archivo Black','Arial Black',sans-serif;font-size:clamp(40px,7vw,112px);line-height:1;color:#111;letter-spacing:-.01em;
  text-shadow:0 -.05em #EF4E36,0 -.1em #F6C76A,0 .05em #3BB3E0,0 .1em #7FE8B5;opacity:0;transform:scale(.94);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
#intro .i1.on{opacity:1;transform:none}
#intro .i2{font-family:'Gothic A1','Noto Sans KR',sans-serif;font-weight:200;letter-spacing:.04em;font-size:clamp(16px,3.3vw,46px);text-wrap:balance;color:#111;margin-top:.7em;min-height:1.3em;line-height:1.3}
#intro .i3{font-family:'Noto Sans KR',sans-serif;font-weight:400;font-size:clamp(18px,2.4vw,30px);color:#444;margin-top:.7em;min-height:1.5em;letter-spacing:.02em}
#intro .cur{display:inline-block;width:.08em;height:1em;margin-left:.08em;background:#111;vertical-align:-.12em;animation:blink .9s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#intro .skip{position:absolute;right:20px;bottom:calc(18px + env(safe-area-inset-bottom));font:600 12px Montserrat,sans-serif;letter-spacing:.18em;text-transform:uppercase;background:none;border:none;color:#888;cursor:pointer;padding:8px}
#intro .skip:hover{color:#111}
body.intro-on{overflow:hidden}
</style>

/* approximate rendered width of tag text (12.5px Noto Sans KR bold) */
function tw(s){let w=0;for(const ch of s){if(/[\uac00-\ud7a3]/.test(ch))w+=12.6;else if(/[A-Z]/.test(ch))w+=8.6;else if(/[a-z0-9]/.test(ch))w+=7.4;else if(ch===" ")w+=3.6;else if("()·".includes(ch))w+=4.6;else w+=7;}return w;}
/* marker styles: "num" | "dot" | "star" | "flag" | "pin" */
const MARK="pin";
function marker(g,x,y,n){
  if(MARK==="num"){el("rect",{x:x-11,y:y-11,width:22,height:22,fill:"#111",transform:`rotate(45 ${x} ${y})`,class:"dm"},g);
    el("text",{x,y:y+4.5,"text-anchor":"middle",class:"mont dn","font-weight":800,"font-size":12,fill:"#fff"},g).textContent=n;return;}
  if(MARK==="dot"){el("rect",{x:x-8,y:y-8,width:16,height:16,fill:"#111",transform:`rotate(45 ${x} ${y})`,class:"dm"},g);
    el("circle",{cx:x,cy:y,r:2.6,fill:"#fff",class:"dn"},g);return;}
  if(MARK==="star"){let d="";for(let i=0;i<10;i++){const r=i%2?5.6:13,a=-Math.PI/2+i*Math.PI/5;d+=(i?"L":"M")+(x+r*Math.cos(a)).toFixed(1)+","+(y+r*Math.sin(a)).toFixed(1);}
    el("path",{d:d+"Z",fill:"#111",class:"dm","stroke-linejoin":"round"},g);return;}
  if(MARK==="flag"){el("circle",{cx:x,cy:y,r:3.2,fill:"#111",stroke:"#fff","stroke-width":1.5},g);
    el("line",{x1:x,y1:y,x2:x,y2:y-26,stroke:"#111","stroke-width":2.4,"stroke-linecap":"round"},g);
    el("path",{d:`M${x},${y-26} L${x+17},${y-20.5} L${x},${y-15} Z`,fill:"#111",class:"dm","stroke-linejoin":"round"},g);return;}
  if(MARK==="pin"){el("ellipse",{cx:x,cy:y,rx:5,ry:2,fill:"#111",opacity:.35},g);
    el("path",{d:`M${x},${y} C${x-3},${y-7} ${x-10},${y-12} ${x-10},${y-19} A10,10 0 1 1 ${x+10},${y-19} C${x+10},${y-12} ${x+3},${y-7} ${x},${y}Z`,fill:"var(--pinc)",class:"dm"},g);
    el("circle",{cx:x,cy:y-19,r:3.6,fill:"#111",class:"dn"},g);return;}
}

  return `<li><button data-k="${k}">${ic}<span class="nm">${esc(TITLES[k])}${sub?`<small>${sub}</small>`:""}</span><span class="ct">${n}</span></button></li>`;}

   <div class="grp">Abroad</div><ul class="lst" style="list-style:none;margin:0;padding:0">${["nj","my","au"].map(k=>row(k,"✈",true)).join("")}</ul>
   <p class="hint">직장 위치는 구(區) 단위의 대략적인 표시입니다. 이름은 공개를 희망한 동문만 표시됩니다.</p>`;
  pbody.querySelectorAll("button[data-k]").forEach(b=>b.onclick=()=>show(b.dataset.k));}
function card(a){const nm=a.full?esc(a.name):"응통 동문",sub=[a.org,a.role].filter(Boolean).map(esc).join(" · ");
  return `<div class="card${a.full?"":" private"}"><div class="ctop"><div class="av">${esc(a.id)}<small>학번</small></div><div><div class="cname">${nm}</div><div class="crole">${sub}</div></div></div>${a.now?`<div class="cnow">${esc(a.now)}</div>`:""}</div>`;}
function show(k){setActive(k);const list=[...(byKey[k]||[])].sort((a,b)=>+a.id-+b.id);
  const orgs=[...new Set(list.map(a=>a.org==="회사"?"기업":a.org).filter(Boolean))].join(" · ");
  const area=PINS[k]?`<span class="loc">${PINS[k].area}</span>`:(orgs?`<span class="loc">${esc(orgs)}</span>`:"");
  phead.innerHTML=`<button class="back" id="back">← Back to map list</button><h2>${esc(TITLES[k])}</h2><p>${list.length}명의 동문 · 실명 공개 ${list.filter(a=>a.full).length}명</p>${area}`;
  pbody.innerHTML=list.map(card).join("");pbody.scrollTop=0;document.getElementById("back").onclick=home;
  if(isMobile()){document.body.classList.add("sheet-open");const x=document.createElement("button");x.className="sheet-x";x.setAttribute("aria-label","닫기");x.textContent="×";x.onclick=home;phead.appendChild(x);}}
const isMobile=()=>window.matchMedia("(max-width:860px)").matches;
document.getElementById("scrim").onclick=()=>home();
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.body.classList.contains("sheet-open"))home();});
function bind(g,k){g.addEventListener("click",()=>show(k));g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();show(k);}});}
home();
/* desktop: widen the map to fill the available area */
const svgEl=document.getElementById("map"),clipR=document.getElementById("cliprect");
function layout(){
  if(isMobile()){svgEl.setAttribute("viewBox","0 0 800 1070");clipR.setAttribute("x",50);clipR.setAttribute("width",700);return;}
  const r=svgEl.getBoundingClientRect();if(!r.width||!r.height)return;
  const H=730,W=Math.max(700,H*r.width/r.height),x0=400-W/2;
  svgEl.setAttribute("viewBox",`${x0} 50 ${W} ${H}`);clipR.setAttribute("x",x0);clipR.setAttribute("width",W);
}
layout();addEventListener("resize",layout);
/* ---------- intro sequence ---------- */
(function(){
  const box=document.getElementById("intro"),i1=box.querySelector(".i1"),i2=box.querySelector(".i2"),i3=box.querySelector(".i3");
  let done=false;const T=[];const later=(f,ms)=>T.push(setTimeout(f,ms));
  function finish(){if(done)return;done=true;T.forEach(clearTimeout);box.classList.add("out");document.body.classList.remove("intro-on");
    try{sessionStorage.setItem("aeltsIntro","1")}catch(e){}setTimeout(()=>box.remove(),800);layout();}
  let seen=false;try{seen=sessionStorage.getItem("aeltsIntro")==="1"}catch(e){}
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(seen||location.hash==="#map"){box.remove();return;}
  document.body.classList.add("intro-on");
  box.querySelector(".skip").onclick=finish;box.addEventListener("click",e=>{if(!e.target.closest(".skip"))finish();});
  addEventListener("keydown",e=>{if(!done&&(e.key==="Escape"||e.key==="Enter"||e.key===" "))finish();});
  if(reduce){i1.classList.add("on");i2.textContent="다시 잇는 응통, 지금 우린 어디에?";later(finish,2200);return;}
  function type(el,text,speed,cb){const cur=document.createElement("span");cur.className="cur";el.textContent="";el.appendChild(cur);let i=0;
    (function step(){if(done)return;if(i<text.length){cur.before(text[i++]);later(step,speed);}else cb&&cb(cur);})();}
  later(()=>i1.classList.add("on"),250);
  later(()=>type(i2,"다시 잇는 응통, 지금 우린 어디에?",110,()=>later(finish,1500)),1100);
})();
</script>
